name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # A change to publishable source must bump the version, or it can't be
      # released — and a forgotten bump is easy to miss in review. Fail the PR
      # when src/ differs from the base branch but package.json version doesn't.
      - name: Require a version bump when source changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --quiet "origin/${{ github.base_ref }}" HEAD -- src/; then
            echo "No src/ changes vs base — version bump not required."
            exit 0
          fi
          CURRENT=$(node -p "require('./package.json').version")
          BASE=$(git show "origin/${{ github.base_ref }}:package.json" \
            | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          if [ "$CURRENT" = "$BASE" ]; then
            echo "::error::src/ changed but package.json version is unchanged ($CURRENT) — bump it so the change is publishable."
            exit 1
          fi
          echo "Version bumped: $BASE -> $CURRENT"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:esm-load

  review:
    needs: ci
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      checks: read
    uses: verevoir/aigency-governance/.github/workflows/review.yml@a04d0c95b19695d3c158bce480f09ec35b81a1c4 # governance #29, @verevoir/review 0.3.2 (2026-11-05)
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      governance-token: ${{ secrets.GOVERNANCE_TOKEN }}
